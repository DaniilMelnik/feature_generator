[project]
name = "feature-generator"
version = "0.1.0"
description = "Autonomous LLM-driven feature-engineering pipeline for classical binary classification models"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.60",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "anthropic>=0.68.0",
    "catboost>=1.2.7",
    "shap>=0.46.0",
    "numba>=0.60.0",
    "llvmlite>=0.43.0",
    "scikit-learn>=1.5.2",
    "pandas>=2.2.3",
    "numpy>=1.26.4",
    "scipy>=1.13.1",
    "pyarrow>=17.0.0",
    "duckdb>=1.1.3",
    "docker>=7.1.0",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.6.1",
    "pyyaml>=6.0.2",
    "click>=8.1.7",
    "rich>=13.9.4",
    "python-dotenv>=1.0.1",
    "jinja2>=3.1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-mock>=3.14.0",
    "kaggle>=1.6.17",
]

[project.scripts]
feature-gen = "feature_generator.cli:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
markers = [
    "docker: tests that require a running Docker daemon",
    "llm: tests that make real Anthropic API calls (require ANTHROPIC_API_KEY)",
]

[tool.uv]
package = true
